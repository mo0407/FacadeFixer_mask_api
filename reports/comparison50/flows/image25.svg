<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1910" role="img"><title>image2.5：局部画布 → 模型mask → 原图坐标</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="30" y="42" font-size="26" font-weight="bold">image2.5：局部画布 → 模型mask → 原图坐标</text><polyline points="535.0,195 535.0,245" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="535.0,385 535.0,435" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="535.0,560 535.0,610" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="535.0,750 535.0,810" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="535.0,935 535.0,985" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="535.0,1110 535.0,1160" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="535.0,1295 535.0,1345" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="535.0,1485 535.0,1535" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="535.0,1645 535.0,1695" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="1000,680.0 1080,690.0" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><text x="1088" y="678.0" fill="#475569" font-size="15">保存映射</text><polyline points="1000,315.0 1080,315.0" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><text x="1088" y="303.0" fill="#475569" font-size="15">跳过/复用</text><polyline points="1000,1047.5 1080,1077.5" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><text x="1088" y="1065.5" fill="#475569" font-size="15">失败</text><polyline points="1000,1765.0 1080,1765.0" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><text x="1088" y="1753.0" fill="#475569" font-size="15">记录</text><polyline points="1385.0,770 1710,790 1710,1310 535,1310 535.0,1345" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><text x="543.0" y="1333" fill="#475569" font-size="15">逆映射参数</text><polyline points="1385.0,385 1735,400 1735,1665 535,1665 535.0,1695" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><text x="543.0" y="1683" fill="#475569" font-size="15">沿用到聚合</text><rect x="70" y="80" width="930" height="115" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="84" y="109" font-size="21" font-weight="bold">01 输入与预检查</text><text x="84" y="137" font-size="18">原图 I(H×W×3) + 冻结 bbox/ID/类型/子类型</text><text x="84" y="162" font-size="18">读取模型配置、环境变量/密钥文件；检查范围与bbox；不重新检测</text><text x="84" y="187" font-size="18">默认 dry-run：不发请求；--run 才进入付费处理</text><rect x="70" y="245" width="930" height="140" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="84" y="274" font-size="21" font-weight="bold">02 缓存、复用与提交门控</text><text x="84" y="302" font-size="18">已有成功记录：验证原图/输出哈希后跳过</text><text x="84" y="327" font-size="18">已有失败记录：默认跳过；--retry-failed 才在本轮重试一次</text><text x="84" y="352" font-size="18">首次且00/04历史试验可用：核对bbox/类型并复制、标记 carried_forward</text><text x="84" y="377" font-size="18">无可用记录 → 当前实例进入裁剪；本次00和04走历史复用</text><rect x="70" y="435" width="930" height="125" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="84" y="464" font-size="21" font-weight="bold">03 取局部上下文 ROI</text><text x="84" y="492" font-size="18">横向边距=max(12, round(bbox宽×20%))</text><text x="84" y="517" font-size="18">纵向边距=max(12, round(bbox高×2.5%))；ROI裁到原图边界</text><text x="84" y="542" font-size="18">得到局部RGB及其原图偏移 (a,b)；bbox仍保持冻结</text><rect x="70" y="610" width="930" height="140" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="84" y="639" font-size="21" font-weight="bold">04 选择单面板或四段拼图</text><text x="84" y="667" font-size="18">max(ROI宽/高, ROI高/宽) &gt; 3？</text><text x="84" y="692" font-size="18">是：沿长边等分4段，按阅读顺序放入2×2网格（每格512）</text><text x="84" y="717" font-size="18">否：使用一个1024面板；每面板等比缩放、居中留边</text><text x="84" y="742" font-size="18">总画布固定1024×1024，洋红补边；图像缩放使用LANCZOS</text><rect x="1080" y="610" width="610" height="160" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1094" y="639" font-size="21" font-weight="bold">并行产物：geometry.json</text><text x="1094" y="667" font-size="18">每面板 source_xyxy / canvas_xyxy</text><text x="1094" y="690" font-size="18">scale_xy=(sx,sy) 与画布内目标bbox</text><text x="1094" y="713" font-size="18">前向坐标：u=(x-x0)×sx+ox</text><text x="1094" y="736" font-size="18">v=(y-y0)×sy+oy</text><text x="1094" y="759" font-size="18">这些数据只用于提示和确定性逆映射</text><rect x="70" y="810" width="930" height="125" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="84" y="839" font-size="21" font-weight="bold">05 构造提示并持久化请求输入</text><text x="84" y="867" font-size="18">上传PNG画布 + 类型定义 + 实例ID + 画布bbox坐标</text><text x="84" y="892" font-size="18">要求逐面板原位分割，白=目标，黑=背景/补边；不画框或文字</text><text x="84" y="917" font-size="18">垃圾/墙面污渍使用独立子类型提示；保存submitted_images与prompt</text><rect x="70" y="985" width="930" height="125" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="84" y="1014" font-size="21" font-weight="bold">06 单实例图像API请求</text><text x="84" y="1042" font-size="18">POST /v1/images/edits，multipart：PNG + prompt + model</text><text x="84" y="1067" font-size="18">服务商标识 gpt-image-2.5；请求 size=1024x1024、quality=high</text><text x="84" y="1092" font-size="18">接收base64或图片URL；下载并保留原始返回；每bbox一次请求</text><rect x="1080" y="985" width="610" height="185" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="1094" y="1014" font-size="21" font-weight="bold">异常支路：失败不伪造mask</text><text x="1094" y="1042" font-size="18">HTTP / SSL / 下载 / 解码失败 → 记录错误</text><text x="1094" y="1067" font-size="18">401/403设置停止标记，阻止后续新提交</text><text x="1094" y="1092" font-size="18">不进行自动付费重试；需显式 retry-failed</text><text x="1094" y="1117" font-size="18">保存attempts、耗时、可获得的usage与费用</text><text x="1094" y="1142" font-size="18">缺失实例导致图片partial，不能视为无缺陷</text><rect x="70" y="1160" width="930" height="135" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="84" y="1189" font-size="21" font-weight="bold">07 校验返回画布并二值化</text><text x="84" y="1217" font-size="18">拒绝 |返回宽/高 - 1| &gt; 0.02 的图像，不强行拉伸</text><text x="84" y="1240" font-size="18">透明区域合成到黑底 → 灰度 → 阈值128 → 0/255</text><text x="84" y="1263" font-size="18">最近邻归一到1024×1024；实际返回可不是1024</text><text x="84" y="1286" font-size="18">非方形比例异常也进入失败记录支路</text><rect x="70" y="1345" width="930" height="140" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="84" y="1374" font-size="21" font-weight="bold">08 根据保存的几何信息逆映射</text><text x="84" y="1402" font-size="18">从归一画布裁出各面板 canvas_xyxy</text><text x="84" y="1427" font-size="18">最近邻还原成 source_xyxy 对应的原图区域大小</text><text x="84" y="1452" font-size="18">按原图坐标贴回全黑 H×W 画布；保存 unclipped mask</text><text x="84" y="1477" font-size="18">此处只还原坐标，不按原图纹理修边；生成内容仍可能错位</text><rect x="70" y="1535" width="930" height="110" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="84" y="1564" font-size="21" font-weight="bold">09 裁到冻结bbox，保存原尺寸实例mask</text><text x="84" y="1592" font-size="18">final[y1:y2,x1:x2] = restored[y1:y2,x1:x2]，框外=0</text><text x="84" y="1617" font-size="18">保存mask哈希、空结果标记、框外裁除像素数；空mask也需复核</text><rect x="70" y="1695" width="930" height="140" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="84" y="1724" font-size="21" font-weight="bold">10 聚合、叠加、JSON/RLE和统计</text><text x="84" y="1752" font-size="18">按实例/类别/全部并集导出；叠加使用原图与mask混合着色</text><text x="84" y="1777" font-size="18">成功记录保留usage、token、API秒数、总秒数和估算费用</text><text x="84" y="1802" font-size="18">token未知记null；失败费用未知不当作0；原始账单未独立核验</text><text x="84" y="1827" font-size="18">本次105/109有mask；00/04复用来源单独记录</text><rect x="1080" y="245" width="610" height="140" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1094" y="274" font-size="21" font-weight="bold">沿用分支的输出</text><text x="1094" y="302" font-size="18">不发起当前实例新请求</text><text x="1094" y="327" font-size="18">已有成功记录 / 合法历史复用 → 聚合</text><text x="1094" y="352" font-size="18">历史复用保留原始输入、几何及mask</text><text x="1094" y="377" font-size="18">不是本轮同条件新盲测</text><rect x="1080" y="1695" width="610" height="140" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1094" y="1724" font-size="21" font-weight="bold">旁路记录 / 不参与分割</text><text x="1094" y="1752" font-size="18">records/*.json：每次attempt状态、usage</text><text x="1094" y="1777" font-size="18">geometry/*.json：坐标变换</text><text x="1094" y="1802" font-size="18">raw_model_outputs / raw_masks：模型原稿</text><text x="1094" y="1827" font-size="18">任何参考mask都不进入API或坐标还原</text></g></svg>