<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1540" role="img"><title>纯 OpenCV：原图像素规则分割</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="30" y="42" font-size="26" font-weight="bold">纯 OpenCV：原图像素规则分割</text><polyline points="900.0,210 900.0,260" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="900.0,380 900,410 157.5,410 157.5,470" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><text x="165.5" y="458" fill="#475569" font-size="15">按类别</text><polyline points="900.0,380 900,410 452.5,410 452.5,470" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><text x="460.5" y="458" fill="#475569" font-size="15">按类别</text><polyline points="900.0,380 900,410 747.5,410 747.5,470" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><text x="755.5" y="458" fill="#475569" font-size="15">按类别</text><polyline points="900.0,380 900,410 1042.5,410 1042.5,470" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><text x="1050.5" y="458" fill="#475569" font-size="15">按类别</text><polyline points="900.0,380 900,410 1337.5,410 1337.5,470" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><text x="1345.5" y="458" fill="#475569" font-size="15">按类别</text><polyline points="900.0,380 900,410 1637.5,410 1637.5,470" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><text x="1645.5" y="458" fill="#475569" font-size="15">按类别</text><polyline points="157.5,700 157.5,750 900,750 900.0,800" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="452.5,700 452.5,750 900,750 900.0,800" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="747.5,700 747.5,750 900,750 900.0,800" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="1042.5,700 1042.5,750 900,750 900.0,800" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="1337.5,700 1337.5,750 900,750 900.0,800" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="1637.5,700 1637.5,750 900,750 900.0,800" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="900.0,930 900.0,980" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="900.0,1100 900.0,1160" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="900.0,1310 900.0,1360" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="440" y="80" width="920" height="130" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="454" y="109" font-size="21" font-weight="bold">01 输入：只读原图 + 冻结检测清单</text><text x="454" y="137" font-size="18">原图 I：H×W×3 RGB；每张可有多个实例</text><text x="454" y="162" font-size="18">每实例：ID、类别/子类型、bbox=[x1,y1,x2,y2)，坐标为原图像素</text><text x="454" y="187" font-size="18">不读取 API mask、参考 mask 或人工逐图轮廓</text><rect x="440" y="260" width="920" height="120" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="454" y="289" font-size="21" font-weight="bold">02 逐实例裁剪与计算尺度</text><text x="454" y="317" font-size="18">ROI = I[y1:y2, x1:x2]；记录原始 ROI 宽高、偏移与缩放</text><text x="454" y="342" font-size="18">裂缝 C/M：原分辨率；其他类：ROI 长边最多 1000 像素</text><text x="454" y="367" font-size="18">由类别分流；下方六条分支只执行对应的一条</text><rect x="20" y="470" width="275" height="230" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="34" y="499" font-size="17" font-weight="bold">03A 裂缝 C / 网裂 M</text><text x="34" y="527" font-size="15">RGB → 灰度 → Gaussian 平滑</text><text x="34" y="554" font-size="15">多尺度 black-hat 取最大响应</text><text x="34" y="581" font-size="15">响应阈值：Otsu×0.65，限7–30</text><text x="34" y="608" font-size="15">另约束灰度 &lt; 第80百分位</text><text x="34" y="635" font-size="15">连通域及线形过滤</text><text x="34" y="662" font-size="15">不做破坏细线的大开运算</text><rect x="315" y="470" width="275" height="230" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="329" y="499" font-size="17" font-weight="bold">03B 锈迹 T / 腐蚀 R</text><text x="329" y="527" font-size="15">RGB → HSV 和 Lab</text><text x="329" y="554" font-size="15">筛红、橙、棕色像素</text><text x="329" y="581" font-size="15">H&lt;27 或 H&gt;173；S&gt;48</text><text x="329" y="608" font-size="15">V&gt;28；Lab a&gt;127、b&gt;132</text><text x="329" y="635" font-size="15">去小连通域，填少量小孔</text><text x="329" y="662" font-size="15">颜色不能独立证明锈蚀语义</text><rect x="610" y="470" width="275" height="230" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="624" y="499" font-size="17" font-weight="bold">03C 植物 V</text><text x="624" y="527" font-size="15">RGB → HSV + 灰度</text><text x="624" y="554" font-size="15">绿色条件：H 29–100</text><text x="624" y="581" font-size="15">S&gt;38 且 V&gt;28</text><text x="624" y="608" font-size="15">另取暗色：灰度 &lt; 截断Otsu</text><text x="624" y="635" font-size="15">绿色 ∪ 暗色 → 连通域过滤</text><text x="624" y="662" font-size="15">阴影可能混入</text><rect x="905" y="470" width="275" height="230" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="919" y="499" font-size="17" font-weight="bold">03D 地面垃圾 D</text><text x="919" y="527" font-size="15">子类型必须是 GroundLitter</text><text x="919" y="554" font-size="15">低灰度样本的 Lab 中位数</text><text x="919" y="581" font-size="15">作为地面背景色</text><text x="919" y="608" font-size="15">取较亮像素或高色度/色差</text><text x="919" y="635" font-size="15">亮度分位阈值 + Lab 距离</text><text x="919" y="662" font-size="15">去小连通域；暗色布料可漏</text><rect x="1200" y="470" width="275" height="230" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="1214" y="499" font-size="17" font-weight="bold">03E 污渍 D / 渗漏 L</text><text x="1214" y="527" font-size="15">RGB → 灰度及局部平滑</text><text x="1214" y="554" font-size="15">暗色 Otsu + 局部亮度残差</text><text x="1214" y="581" font-size="15">候选：全局暗 或 局部偏暗</text><text x="1214" y="608" font-size="15">L 额外加入黄棕色条件</text><text x="1214" y="635" font-size="15">去小连通域、填小孔</text><text x="1214" y="662" font-size="15">白色析出物仍可能漏选</text><rect x="1495" y="470" width="285" height="230" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="1509" y="499" font-size="17" font-weight="bold">03F 剥落 P / 破损 S</text><text x="1509" y="527" font-size="15">RGB → Lab → 4类聚类</text><text x="1509" y="554" font-size="15">bbox边缘主色估计完好背景</text><text x="1509" y="581" font-size="15">色差选择前景簇 → 种子</text><text x="1509" y="608" font-size="15">腐蚀内核=确定前景</text><text x="1509" y="635" font-size="15">边缘非目标=确定背景</text><text x="1509" y="662" font-size="15">GrabCut 3轮 → 清理与填小孔</text><rect x="440" y="800" width="920" height="130" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="454" y="829" font-size="21" font-weight="bold">04 输出 ROI 二值候选，保留方法与参数</text><text x="454" y="857" font-size="18">每条分支产生当前 ROI 大小的 0/1 mask</text><text x="454" y="882" font-size="18">P/S：GrabCut失败或种子不足时使用聚类种子并记录原因</text><text x="454" y="907" font-size="18">记录尺度、阈值、前景比例和可能的阴影/材质误判</text><rect x="440" y="980" width="920" height="120" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="454" y="1009" font-size="21" font-weight="bold">05 还原到原图坐标</text><text x="454" y="1037" font-size="18">若ROI缩小过：最近邻恢复到原bbox宽高</text><text x="454" y="1062" font-size="18">建立全黑 H×W 画布，在 [x1:x2, y1:y2] 对应位置贴回</text><text x="454" y="1087" font-size="18">每个实例单独保存，不把不同bbox合成一个实例</text><rect x="440" y="1160" width="920" height="150" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="454" y="1189" font-size="21" font-weight="bold">06 聚合与导出</text><text x="454" y="1217" font-size="18">实例 mask_i → 按类并集 → 全部实例并集 M_total</text><text x="454" y="1242" font-size="18">M_total / mask_i 均为 H×W，PNG单通道0/255</text><text x="454" y="1267" font-size="18">原图 + 实例彩色mask + bbox/ID → 叠加图；同时输出bbox图</text><text x="454" y="1292" font-size="18">JSON含类别、bbox、面积、列优先RLE；保存耗时、参数、质量提示</text><rect x="440" y="1360" width="920" height="125" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="454" y="1389" font-size="21" font-weight="bold">07 结果验证与人工复核</text><text x="454" y="1417" font-size="18">检查尺寸、二值、bbox范围、实例并集及RLE可逆性</text><text x="454" y="1442" font-size="18">小/空mask、几乎填满bbox等仅触发复核，不代表自动判错</text><text x="454" y="1467" font-size="18">本次109实例全部有文件；不代表109实例分割正确</text></g></svg>