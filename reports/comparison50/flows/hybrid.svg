<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1970" role="img"><title>image2.5 + OpenCV：先验约束精修与回退</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="30" y="42" font-size="26" font-weight="bold">image2.5 + OpenCV：先验约束精修与回退</text><polyline points="850.0,205 850.0,255" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="850.0,375 850.0,425" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="850.0,565 850,600 435,600 435.0,635" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><text x="443.0" y="623" fill="#475569" font-size="15">C/M</text><polyline points="850.0,565 850,600 1265,600 1265.0,635" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><text x="1273.0" y="623" fill="#475569" font-size="15">其他类别</text><polyline points="435.0,865 435,910 850,910 850.0,955" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="1265.0,865 1265,910 850,910 850.0,955" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="850.0,1075 850.0,1125" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="850.0,1275 850,1310 435,1310 435.0,1345" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><text x="443.0" y="1333" fill="#475569" font-size="15">通过</text><polyline points="850.0,1275 850,1310 1265,1310 1265.0,1345" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><text x="1273.0" y="1333" fill="#475569" font-size="15">拒绝/异常</text><polyline points="435.0,1470 435,1515 850,1515 850.0,1560" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="1265.0,1470 1265,1515 850,1515 850.0,1560" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="850.0,1710 850.0,1760" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="300" y="80" width="1100" height="125" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="314" y="109" font-size="21" font-weight="bold">01 输入：原图 + 冻结目标 + 已有API实例mask</text><text x="314" y="137" font-size="18">原图 I(H×W×3)、mask_i(H×W 0/255)、bbox、类别/ID、源文件哈希</text><text x="314" y="162" font-size="18">只使用这批API输出作为先验；不读取参考真值、人工轮廓</text><text x="314" y="187" font-size="18">输入缺少API实例 → 保持缺失/partial，不新增分割结果</text><rect x="300" y="255" width="1100" height="120" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="314" y="284" font-size="21" font-weight="bold">02 校验并保留原稿</text><text x="314" y="312" font-size="18">核对图像哈希、尺寸、二值值域及mask在bbox内</text><text x="314" y="337" font-size="18">空输入mask：原样回退并记录empty_input</text><text x="314" y="362" font-size="18">复制原图、原API总mask/叠加图；逐实例原稿单独保存</text><rect x="300" y="425" width="1100" height="140" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="314" y="454" font-size="21" font-weight="bold">03 确定搜索范围和处理尺度</text><text x="314" y="482" font-size="18">band=clip(round(bbox短边×2.5%), 4, 32) 原图像素</text><text x="314" y="507" font-size="18">取bbox外扩band的原图ROI；allowed只允许冻结bbox内部</text><text x="314" y="532" font-size="18">裂缝C/M不缩小；其他类：ROI长边最多1200，记录scale</text><text x="314" y="557" font-size="18">outer = 膨胀(API mask, round(band×scale)) ∩ allowed</text><rect x="70" y="635" width="730" height="230" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="84" y="664" font-size="21" font-weight="bold">04A 裂缝 C / 网裂 M：在搜索带中找暗线</text><text x="84" y="692" font-size="18">ROI RGB → 灰度 → 3×3 Gaussian(σ=0.6)</text><text x="84" y="717" font-size="18">椭圆核半径2/4/8的black-hat响应，逐像素取最大</text><text x="84" y="742" font-size="18">仅在outer取样求Otsu阈值，阈值下限4</text><text x="84" y="767" font-size="18">candidate = outer ∩ (response &gt; threshold)</text><text x="84" y="792" font-size="18">8邻域连通域，移除面积&lt;3的小孤点</text><text x="84" y="817" font-size="18">不做大范围闭运算，不依靠参考裂缝定位</text><rect x="900" y="635" width="730" height="230" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="914" y="664" font-size="21" font-weight="bold">04B 其他类别：API先验初始化 GrabCut</text><text x="914" y="692" font-size="18">outer外=确定背景；outer内=可能背景</text><text x="914" y="717" font-size="18">原API mask内=可能前景；腐蚀内核=确定前景</text><text x="914" y="742" font-size="18">内核不足5像素：尝试距离变换&gt;1的内部点</text><text x="914" y="767" font-size="18">前景/背景仍不足 → 异常回退</text><text x="914" y="792" font-size="18">固定随机种子，GrabCut 4轮；只取outer内前景</text><text x="914" y="817" font-size="18">与纯OpenCV基线不同：不再按各类别单独颜色阈值</text><rect x="300" y="955" width="1100" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="314" y="984" font-size="21" font-weight="bold">05 候选还原与bbox限制</text><text x="314" y="1012" font-size="18">若缩小过：最近邻恢复ROI原尺寸，贴回H×W全黑画布</text><text x="314" y="1037" font-size="18">candidate &amp;= 冻结bbox；保存候选mask，不覆盖原API</text><text x="314" y="1062" font-size="18">求解异常时保存与原mask相同的占位候选，并标solver_failed</text><rect x="300" y="1125" width="1100" height="150" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="314" y="1154" font-size="21" font-weight="bold">06 异常筛选（不是准确率评估）</text><text x="314" y="1182" font-size="18">计算面积比 r=候选面积/原mask面积，以及候选与原mask的IoU</text><text x="314" y="1207" font-size="18">候选为空，或 r&lt;0.35 / r&gt;2.5，或 IoU&lt;0.10 → 拒绝</text><text x="314" y="1232" font-size="18">这是与API先验的分歧检查；API本身可能错误</text><text x="314" y="1257" font-size="18">语义/裂缝/空腔风险另记复核标签，不单凭标签拒绝</text><rect x="70" y="1345" width="730" height="125" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="84" y="1374" font-size="21" font-weight="bold">07A 通过异常检查</text><text x="84" y="1402" font-size="18">selected = candidate</text><text x="84" y="1427" font-size="18">标记 refined_candidate；本次93个</text><text x="84" y="1452" font-size="18">通过只代表未触发异常阈值，不保证变好</text><rect x="900" y="1345" width="730" height="125" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="914" y="1374" font-size="21" font-weight="bold">07B 触发异常或求解失败</text><text x="914" y="1402" font-size="18">selected = 原API mask</text><text x="914" y="1427" font-size="18">标记 raw_fallback；本次12个</text><text x="914" y="1452" font-size="18">保留候选/原因，不能把原有错误当作已修复</text><rect x="300" y="1560" width="1100" height="150" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="314" y="1589" font-size="21" font-weight="bold">08 聚合并保存三份实例结果</text><text x="314" y="1617" font-size="18">raw_instance_masks：原稿；candidate_instance_masks：候选</text><text x="314" y="1642" font-size="18">instance_masks：最终选用；按类与全图并集 → mask和叠加图</text><text x="314" y="1667" font-size="18">JSON/RLE记录source_mask_sha256、尺度、搜索半径、面积变化</text><text x="314" y="1692" font-size="18">记录opencv_seconds与回退原因；新增API请求/token/费用均为0</text><rect x="300" y="1760" width="1100" height="140" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="314" y="1789" font-size="21" font-weight="bold">09 单独评估与复核（只读，不反馈调参）</text><text x="314" y="1817" font-size="18">检查尺寸/二值/bbox/RLE/并集；先确认文件一致性</text><text x="314" y="1842" font-size="18">需要评估时才读取参考mask：实例ID、类型、bbox和原图哈希对齐</text><text x="314" y="1867" font-size="18">输出IoU、Dice、精确率、召回率、2px边界F1；人工看前后叠加</text><text x="314" y="1892" font-size="18">本次区域宏IoU提高，但边界F1下降：不能自动覆盖所有原稿</text></g></svg>