<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="825" viewBox="0 0 1040 825"><title>image2.5：局部输入与原图还原</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52766f"/></marker></defs><rect width="1040" height="825" fill="#faf9f5"/><rect x="20" y="15" width="660" height="94" rx="9" fill="#e0f0eb" stroke="#84a89e" stroke-width="1.5"/><text x="350.0" y="49" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#17313d">输入原图、检测框与缺陷类型</text><text x="350.0" y="77" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">使用固定检测结果，不重新检测</text><text x="860" y="50" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#17313d">目的／注意</text><text x="860" y="80" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">统一输入，便于公平比较</text><path d="M350 109 V147" fill="none" stroke="#52766f" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="150" width="660" height="94" rx="9" fill="#fff" stroke="#84a89e" stroke-width="1.5"/><text x="350.0" y="184" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#17313d">裁出目标及周围墙面</text><text x="350.0" y="212" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">保留少量上下文，记录裁剪位置</text><text x="860" y="185" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#17313d">目的／注意</text><text x="860" y="215" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">看清缺陷，也保留背景参照</text><path d="M350 244 V282" fill="none" stroke="#52766f" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="285" width="660" height="94" rx="9" fill="#fff" stroke="#84a89e" stroke-width="1.5"/><text x="350.0" y="319" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#17313d">整理成模型输入画布</text><text x="350.0" y="347" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">细长区域分段排列，记录缩放与拼接关系</text><text x="860" y="320" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#17313d">目的／注意</text><text x="860" y="350" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">避免细长缺陷被缩得过小</text><path d="M350 379 V417" fill="none" stroke="#52766f" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="420" width="660" height="94" rx="9" fill="#fff" stroke="#84a89e" stroke-width="1.5"/><text x="350.0" y="454" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#17313d">调用API生成黑白mask</text><text x="350.0" y="482" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">每个缺陷单独请求，提示目标类型与位置</text><text x="860" y="455" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#17313d">目的／注意</text><text x="860" y="485" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">白色是缺陷，黑色是背景</text><path d="M350 514 V552" fill="none" stroke="#52766f" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="555" width="660" height="94" rx="9" fill="#fff" stroke="#84a89e" stroke-width="1.5"/><text x="350.0" y="589" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#17313d">解码并还原到原图</text><text x="350.0" y="617" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">二值化、拆回各段、恢复尺寸并放回坐标</text><text x="860" y="590" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#17313d">目的／注意</text><text x="860" y="620" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">坐标还原不能消除模型画偏</text><path d="M350 649 V687" fill="none" stroke="#52766f" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="690" width="660" height="94" rx="9" fill="#e0f0eb" stroke="#84a89e" stroke-width="1.5"/><text x="350.0" y="724" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#17313d">输出实例mask、整图mask与叠加图</text><text x="350.0" y="752" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">同时记录耗时、token、费用和失败状态</text><text x="860" y="725" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#17313d">目的／注意</text><text x="860" y="755" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">失败项后续单独重试</text></svg>