<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="840" viewBox="0 0 1040 840"><title>OpenCV：按类型选择处理方法</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52766f"/></marker></defs><rect width="1040" height="840" fill="#faf9f5"/><rect x="230" y="15" width="580" height="94" rx="9" fill="#e0f0eb" stroke="#84a89e" stroke-width="1.5"/><text x="520.0" y="49" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#17313d">输入原图、检测框与缺陷类型</text><text x="520.0" y="77" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">同一张图中的每个缺陷单独处理</text><path d="M520 109 V142" fill="none" stroke="#52766f" stroke-width="2" marker-end="url(#a)"/><rect x="230" y="145" width="580" height="94" rx="9" fill="#fff" stroke="#84a89e" stroke-width="1.5"/><text x="520.0" y="179" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#17313d">取出检测框内的局部区域</text><text x="520.0" y="207" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">缩小处理范围，记录在原图中的位置</text><path d="M520 239 V268 H180 V300" fill="none" stroke="#52766f" stroke-width="2" marker-end="url(#a)"/><path d="M520 239 V268 H520 V300" fill="none" stroke="#52766f" stroke-width="2" marker-end="url(#a)"/><path d="M520 239 V268 H860 V300" fill="none" stroke="#52766f" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="303" width="320" height="94" rx="9" fill="#fff" stroke="#84a89e" stroke-width="1.5"/><text x="180.0" y="337" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#17313d">裂缝（含网裂）</text><text x="180.0" y="365" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">突出细暗线</text><text x="180.0" y="388" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">筛选连续的线状区域</text><rect x="360" y="303" width="320" height="94" rx="9" fill="#fff" stroke="#84a89e" stroke-width="1.5"/><text x="520.0" y="337" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#17313d">锈迹／污渍等</text><text x="520.0" y="365" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">按颜色与明暗差异</text><text x="520.0" y="388" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">筛选疑似缺陷像素</text><rect x="700" y="303" width="320" height="94" rx="9" fill="#fff" stroke="#84a89e" stroke-width="1.5"/><text x="860.0" y="337" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#17313d">剥落／破损</text><text x="860.0" y="365" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">按颜色分组建立初选区域</text><text x="860.0" y="388" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">再区分前景与背景</text><path d="M180 397 V428 H520 V462" fill="none" stroke="#52766f" stroke-width="2" marker-end="url(#a)"/><path d="M520 397 V428 H520 V462" fill="none" stroke="#52766f" stroke-width="2" marker-end="url(#a)"/><path d="M860 397 V428 H520 V462" fill="none" stroke="#52766f" stroke-width="2" marker-end="url(#a)"/><rect x="230" y="465" width="580" height="94" rx="9" fill="#fff" stroke="#84a89e" stroke-width="1.5"/><text x="520.0" y="499" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#17313d">清理候选区域</text><text x="520.0" y="527" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">去掉小噪点，按方法整理连通区域</text><path d="M520 559 V591" fill="none" stroke="#52766f" stroke-width="2" marker-end="url(#a)"/><rect x="230" y="594" width="580" height="94" rx="9" fill="#fff" stroke="#84a89e" stroke-width="1.5"/><text x="520.0" y="628" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#17313d">还原到原图位置与尺寸</text><text x="520.0" y="656" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">保留独立实例，再合并为整图mask</text><path d="M520 688 V720" fill="none" stroke="#52766f" stroke-width="2" marker-end="url(#a)"/><rect x="230" y="723" width="580" height="94" rx="9" fill="#e0f0eb" stroke="#84a89e" stroke-width="1.5"/><text x="520.0" y="757" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#17313d">输出mask与叠加图</text><text x="520.0" y="785" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">用于逐图检查和量化比较</text></svg>