<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="925" viewBox="0 0 1040 925"><title>API加OpenCV：精修、检查与回退</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52766f"/></marker></defs><rect width="1040" height="925" fill="#faf9f5"/><rect x="220" y="15" width="600" height="94" rx="9" fill="#e0f0eb" stroke="#84a89e" stroke-width="1.5"/><text x="520.0" y="49" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#17313d">输入API初稿＋原图＋检测框／类型</text><text x="520.0" y="77" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">保留原mask，作为精修依据和回退版本</text><path d="M520 109 V143" fill="none" stroke="#52766f" stroke-width="2" marker-end="url(#a)"/><rect x="220" y="146" width="600" height="94" rx="9" fill="#fff" stroke="#84a89e" stroke-width="1.5"/><text x="520.0" y="180" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#17313d">限定调整范围</text><text x="520.0" y="208" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">围绕已有mask，在原图像素上寻找更合适的区域</text><path d="M520 240 V269 H270 V302" fill="none" stroke="#52766f" stroke-width="2" marker-end="url(#a)"/><path d="M520 240 V269 H770 V302" fill="none" stroke="#52766f" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="305" width="440" height="94" rx="9" fill="#fff" stroke="#84a89e" stroke-width="1.5"/><text x="270.0" y="339" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#17313d">裂缝（含网裂）：寻找细暗线</text><text x="270.0" y="367" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">调整线状区域，尽量贴合裂缝</text><rect x="550" y="305" width="440" height="94" rx="9" fill="#fff" stroke="#84a89e" stroke-width="1.5"/><text x="770.0" y="339" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#17313d">区域类：区分前景与背景</text><text x="770.0" y="367" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">用API初稿引导区域分割</text><path d="M270 399 V429 H520 V459" fill="none" stroke="#52766f" stroke-width="2" marker-end="url(#a)"/><path d="M770 399 V429 H520 V459" fill="none" stroke="#52766f" stroke-width="2" marker-end="url(#a)"/><rect x="180" y="462" width="680" height="94" rx="9" fill="#fff0d6" stroke="#84a89e" stroke-width="1.5"/><text x="520.0" y="496" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#17313d">候选结果是否出现异常？</text><text x="520.0" y="524" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">空mask／面积比＜0.35或＞2.50／与初稿IoU＜0.10</text><path d="M520 556 V581 H270 V622" fill="none" stroke="#52766f" stroke-width="2" marker-end="url(#a)"/><path d="M520 556 V581 H770 V622" fill="none" stroke="#52766f" stroke-width="2" marker-end="url(#a)"/><text x="270" y="609" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">未触发异常</text><text x="770" y="609" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">异常或求解失败</text><rect x="50" y="625" width="440" height="94" rx="9" fill="#e0f0eb" stroke="#84a89e" stroke-width="1.5"/><text x="270.0" y="659" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#17313d">采用精修候选</text><text x="270.0" y="687" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">作为该实例的最终mask</text><rect x="550" y="625" width="440" height="94" rx="9" fill="#f9e9e2" stroke="#84a89e" stroke-width="1.5"/><text x="770.0" y="659" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#17313d">回退API初稿</text><text x="770.0" y="687" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">保留原结果，记录回退原因</text><path d="M270 719 V748 H520 V777" fill="none" stroke="#52766f" stroke-width="2" marker-end="url(#a)"/><path d="M770 719 V748 H520 V777" fill="none" stroke="#52766f" stroke-width="2" marker-end="url(#a)"/><rect x="220" y="780" width="600" height="94" rx="9" fill="#e0f0eb" stroke="#84a89e" stroke-width="1.5"/><text x="520.0" y="814" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#17313d">输出最终mask与叠加图</text><text x="520.0" y="842" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">原稿、候选与最终版本分别保存</text><text x="520" y="909" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#17313d">异常检查不是质量验收；被采用的精修结果仍可能退化。</text></svg>